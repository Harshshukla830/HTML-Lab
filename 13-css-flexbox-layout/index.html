
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My CSS Flexbox Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-top: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            margin: 20px;
            background-color: white;
            border: 2px solid darkblue;
            border-radius: 10px;
        }

        .box {
            background-color: #d6eaf8;
            padding: 30px;
            width: 120px;
            text-align: center;
            border: 2px solid steelblue;
            border-radius: 8px;
            transition: 0.3s;
        }

        .box:hover {
            background-color: #aed6f1;
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox Layout</h1>

    <div class="container">

        <div class="box">HTML</div>

        <div class="box">CSS</div>

        <div class="box">JavaScript</div>

        <div class="box">Java</div>

    </div>

</body>
</html>
